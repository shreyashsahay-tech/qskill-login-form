<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Form | QSkill Internship</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your account
            </p>

            <form id="loginForm" novalidate>

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="text"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >

                </div>


                <button type="submit">
                    Login
                </button>

            </form>

            <p class="footer-text">
                QSkill Internship • Slab 1
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
